<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max Ruchira Gaming - Official Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gaming: {
                            dark: '#0a0f1d',
                            card: '#131c31',
                            accent: '#3b82f6',
                            glow: '#60a5fa'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .floating {
            animation: float 4s ease-in-out infinite;
        }
        .glass-panel {
            background: rgba(19, 28, 49, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-effect:hover {
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.4);
        }
    </style>
</head>
<body class="bg-gaming-dark text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-blue-500 selection:text-white relative overflow-x-hidden">

    <div class="absolute top-10 left-1/4 w-72 h-72 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-10 right-1/4 w-72 h-72 bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <main class="w-full max-w-md glass-panel rounded-3xl p-6 sm:p-8 shadow-2xl relative z-10 my-6">
        
        <div class="flex flex-col items-center text-center">
            <div class="relative mb-4 floating">
                <div class="absolute -inset-1 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-full blur opacity-75"></div>
                <img src="https://placehold.co/150x150/1e293b/3b82f6?text=MR" alt="Max Ruchira Gaming Avatar" class="relative w-28 h-28 sm:w-32 sm:h-32 rounded-full object-cover border-2 border-blue-500/50 shadow-xl" onerror="this.src='https://placehold.co/150x150/1e293b/3b82f6?text=MR'">
            </div>
            
            <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-white mb-1">Max Ruchira Gaming</h1>
            <p class="text-slate-400 text-sm font-medium mb-4">Level Up Your Gaming Experience 🎮</p>

            <!-- Status Badge -->
            <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-semibold mb-6 shadow-sm">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                LIVE STREAMING SOON
            </div>
        </div>

        <section aria-labelledby="connect-heading" class="w-full space-y-3.5">
            <h2 id="connect-heading" class="sr-only">Connect With Me</h2>

            <!-- TikTok Button with Logo -->
            <a href="https://www.tiktok.com/@maxruchiragaming" target="_blank" rel="noopener noreferrer" 
               class="flex items-center justify-between w-full p-3.5 rounded-2xl bg-slate-800/80 hover:bg-black hover:border-[#fe2c55]/50 border border-slate-700/60 transition-all duration-300 group glow-effect">
                <div class="flex items-center gap-3.5">
                    <div class="w-10 h-10 rounded-xl bg-black/40 flex items-center justify-center text-[#fe2c55] group-hover:scale-110 transition-transform">
                        <i class="fa-brands fa-tiktok text-xl"></i>
                    </div>
                    <span class="font-semibold text-slate-200 group-hover:text-white text-sm sm:text-base">TikTok</span>
                </div>
                <i class="fa-solid fa-arrow-right text-slate-500 group-hover:text-[#fe2c55] group-hover:translate-x-1 transition-all"></i>
            </a>

            <!-- YouTube Main Channel Button with Logo -->
            <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" 
               class="flex items-center justify-between w-full p-3.5 rounded-2xl bg-slate-800/80 hover:bg-red-950/40 hover:border-red-500/50 border border-slate-700/60 transition-all duration-300 group glow-effect">
                <div class="flex items-center gap-3.5">
                    <div class="w-10 h-10 rounded-xl bg-red-500/10 flex items-center justify-center text-red-500 group-hover:scale-110 transition-transform">
                        <i class="fa-brands fa-youtube text-xl"></i>
                    </div>
                    <span class="font-semibold text-slate-200 group-hover:text-white text-sm sm:text-base">YouTube Channel</span>
                </div>
                <i class="fa-solid fa-arrow-right text-slate-500 group-hover:text-red-400 group-hover:translate-x-1 transition-all"></i>
            </a>

            <!-- YouTube Vlogs Button with Logo -->
            <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" 
               class="flex items-center justify-between w-full p-3.5 rounded-2xl bg-slate-800/80 hover:bg-red-950/40 hover:border-red-500/50 border border-slate-700/60 transition-all duration-300 group glow-effect">
                <div class="flex items-center gap-3.5">
                    <div class="w-10 h-10 rounded-xl bg-red-500/10 flex items-center justify-center text-red-400 group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-video text-lg"></i>
                    </div>
                    <span class="font-semibold text-slate-200 group-hover:text-white text-sm sm:text-base">YouTube Vlogs</span>
                </div>
                <i class="fa-solid fa-arrow-right text-slate-500 group-hover:text-red-400 group-hover:translate-x-1 transition-all"></i>
            </a>

            <!-- Facebook Page Button with Logo -->
            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" 
               class="flex items-center justify-between w-full p-3.5 rounded-2xl bg-slate-800/80 hover:bg-blue-950/40 hover:border-blue-500/50 border border-slate-700/60 transition-all duration-300 group glow-effect">
                <div class="flex items-center gap-3.5">
                    <div class="w-10 h-10 rounded-xl bg-blue-500/10 flex items-center justify-center text-blue-500 group-hover:scale-110 transition-transform">
                        <i class="fa-brands fa-facebook text-xl"></i>
                    </div>
                    <span class="font-semibold text-slate-200 group-hover:text-white text-sm sm:text-base">Facebook Page</span>
                </div>
                <i class="fa-solid fa-arrow-right text-slate-500 group-hover:text-blue-400 group-hover:translate-x-1 transition-all"></i>
            </a>

            <!-- Discord Server Button with Logo -->
            <a href="https://discord.com" target="_blank" rel="noopener noreferrer" 
               class="flex items-center justify-between w-full p-3.5 rounded-2xl bg-slate-800/80 hover:bg-indigo-950/40 hover:border-indigo-500/50 border border-slate-700/60 transition-all duration-300 group glow-effect">
                <div class="flex items-center gap-3.5">
                    <div class="w-10 h-10 rounded-xl bg-indigo-500/10 flex items-center justify-center text-indigo-400 group-hover:scale-110 transition-transform">
                        <i class="fa-brands fa-discord text-xl"></i>
                    </div>
                    <span class="font-semibold text-slate-200 group-hover:text-white text-sm sm:text-base">Discord Community</span>
                </div>
                <i class="fa-solid fa-arrow-right text-slate-500 group-hover:text-indigo-400 group-hover:translate-x-1 transition-all"></i>
            </a>
        </section>

        <footer class="mt-8 text-center text-xs text-slate-500">
            &copy; 2026 Max Ruchira Gaming. All rights reserved.
        </footer>

    </main>

</body>
</html>
