<script>
    // INTRO ASSEMBLY ANIMATION
    window.addEventListener('DOMContentLoaded', () => {
      const overlay = document.getElementById('assembly-overlay');
      const progressBar = document.getElementById('assembly-progress');
      
      setTimeout(() => {
        progressBar.style.width = '100%';
        overlay.classList.add('assembled');
      }, 200);

      setTimeout(() => {
        overlay.classList.add('fade-out');
      }, 1600);

      // Fetch Live YouTube Data
      fetchYouTubeData();
    });

    // MOBILE MENU TOGGLE
    const menuBtn = document.getElementById('menuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    const menuIcon = document.getElementById('menuIcon');
    const closeIcon = document.getElementById('closeIcon');

    menuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
      menuIcon.classList.toggle('hidden');
      closeIcon.classList.toggle('hidden');
    });

    document.querySelectorAll('#mobileMenu a').forEach(link => {
      link.addEventListener('click', () => {
        mobileMenu.classList.add('hidden');
        menuIcon.classList.remove('hidden');
        closeIcon.classList.remove('hidden');
      });
    });

    // HEADER SCROLL EFFECT
    window.addEventListener('scroll', () => {
      const header = document.getElementById('header');
      if (window.scrollY > 50) {
        header.classList.add('py-1');
      } else {
        header.classList.remove('py-1');
      }
    });

    // YOUTUBE API INTEGRATION CONFIG
    const YT_API_KEY = "AIzaSyCNX8WIc6lokFtd5b52ZAgPDCXEYHgETKI";
    const MAIN_CHANNEL_ID = "UCpRnLw-i6ep13w_vh9M9k-g"; //
    const VLOG_CHANNEL_ID = "UCgqcl5-e468Dpr5T29dp9xw";

    async function fetchYouTubeData() {
      try {
        // Fetch Main Channel Stats
        const mainRes = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${MAIN_CHANNEL_ID}&key=${YT_API_KEY}`);
        const mainData = await mainRes.json();
        if (mainData.items && mainData.items.length > 0) {
          const subs = mainData.items[0].statistics.subscriberCount;
          document.getElementById('main-sub-count').innerText = formatSubs(subs);
        }

        // Fetch Vlog Channel Stats
        const vlogRes = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${VLOG_CHANNEL_ID}&key=${YT_API_KEY}`);
        const vlogData = await vlogRes.json();
        if (vlogData.items && vlogData.items.length > 0) {
          const subs = vlogData.items[0].statistics.subscriberCount;
          document.getElementById('vlog-sub-count').innerText = formatSubs(subs);
        }

        // Check for Live Stream / Latest Video on Main Channel
        const searchRes = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${MAIN_CHANNEL_ID}&eventType=live&type=video&key=${YT_API_KEY}`);
        const searchData = await searchRes.json();
        
        const iframe = document.getElementById('live-iframe');
        if (searchData.items && searchData.items.length > 0) {
          const liveVideoId = searchData.items[0].id.videoId;
          iframe.src = `https://www.youtube.com/embed/${liveVideoId}`;
        } else {
          // If not live, fallback to latest uploaded video or specific showcase video
          const uploadsRes = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${MAIN_CHANNEL_ID}&maxResults=1&order=date&type=video&key=${YT_API_KEY}`);
          const uploadsData = await uploadsRes.json();
          if (uploadsData.items && uploadsData.items.length > 0) {
            const latestVideoId = uploadsData.items[0].id.videoId;
            iframe.src = `https://www.youtube.com/embed/${latestVideoId}`;
          }
        }
      } catch (error) {
        console.error("Error fetching YouTube API data:", error);
      }
    }

    function formatSubs(count) {
      if (count >= 1000000) {
        return (count / 1000000).toFixed(1) + 'M';
      } else if (count >= 1000) {
        return (count / 1000).toFixed(1) + 'K';
      }
      return count;
    }

    // SPEC DATA
    const specsData = [
      { id: 1, category: 'pc', name: 'Processor (CPU)', summary: 'AMD Ryzen 9 3900X High Performance Processor', details: ['Model: AMD Ryzen 9 3900X', 'Cores/Threads: 12 Cores / 24 Threads', 'Cooling: NZXT Kraken X63 280mm Liquid Cooler'] },
      { id: 2, category: 'pc', name: 'Graphics Card (GPU)', summary: 'MSI GeForce RTX 5070 Ti 16GB Gaming Trio OC', details: ['Model: MSI GeForce RTX 5070 Ti 16GB Gaming Trio OC', 'VRAM: 16GB GDDR6', 'Ray Tracing & DLSS Enabled'] },
      { id: 3, category: 'pc', name: 'Motherboard & RAM', summary: 'Asus TUF Gaming B550M-Plus & Corsair Vengeance', details: ['Motherboard: Asus TUF Gaming B550M-Plus (Wi-Fi)', 'RAM: CORSAIR VENGEANCE LPX 32GB (16x2) DDR4 3200MHz'] },
      { id: 4, category: 'pc', name: 'Storage & Power', summary: 'High speed NVMe storage & 80+ Gold PSU', details: ['Storage: NVMe M.2 High Speed SSD', 'Power Supply: NZXT C750 - 750W 80 PLUS Gold Certified'] },
      { id: 5, category: 'peripherals', name: 'Monitor & Audio', summary: 'Lenovo Legion 27" IPS 1440P 300Hz Display', details: ['Monitor: Lenovo Legion 27" 27Q-11 IPS 1440P 300Hz', 'Microphone: Professional Broadcast Condenser Mic', 'Setup: Stream Deck & Custom Audio Interface'] },
      { id: 6, category: 'peripherals', name: 'Gaming Keyboard & Mouse', summary: 'Precision mechanical setup', details: ['Switches: Mechanical RGB Gaming Switches', 'Mouse: High DPI Ergonomic Gaming Mouse'] },
      { id: 7, category: 'consoles', name: 'PlayStation 5 Slim', summary: 'Next-gen console gaming & exclusives', details: ['Edition: PS5 Slim Disc Version', 'Resolution: 4K Gaming up to 120Hz', 'Custom DualSense Controllers'] },
      { id: 8, category: 'consoles', name: 'Sim Racing Rig', summary: 'Immersive driving simulation cockpit', details: ['Wheel & Pedals: Logitech G923 Racing Wheel', 'Force Feedback: TrueForce Technology'] },
      { id: 9, category: 'pcspec', name: 'OBS Studio & Streaming', summary: 'Professional broadcasting software', details: ['Setup: Multi-scene setup with custom overlays', 'Encoder: NVIDIA NVENC Hardware Encoding'] }
    ];

    function renderSpecs(category = 'all') {
      const grid = document.getElementById('spec-grid');
      grid.innerHTML = '';

      const filtered = category === 'all' ? specsData : specsData.filter(item => item.category === category);

      filtered.forEach(spec => {
        const card = document.createElement('div');
        card.className = 'glass glass-hover rounded-2xl p-5 cursor-pointer transition-all duration-300 hover:-translate-y-1 flex flex-col justify-between';
        card.onclick = () => openModal(spec);
        card.innerHTML = `
          <div>
            <span class="text-[10px] font-semibold text-purple-400 uppercase tracking-widest bg-purple-950/50 px-2.5 py-1 rounded-md border border-purple-500/20">${spec.category.toUpperCase()}</span>
            <h3 class="font-display font-bold text-lg text-white mt-3 mb-1">${spec.name}</h3>
            <p class="text-xs text-gray-300">${spec.summary}</p>
          </div>
          <div class="mt-4 flex items-center justify-between text-xs text-purple-300 font-semibold pt-3 border-t border-purple-500/20">
            <span>View Specs</span>
            <span>&rarr;</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterCategory(category, bannerImg, event) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      const banner = document.getElementById('setup-banner-img');
      banner.style.opacity = '0';
      setTimeout(() => {
        banner.src = bannerImg;
        banner.style.opacity = '1';
      }, 200);

      renderSpecs(category);
    }

    function openModal(spec) {
      document.getElementById('modal-category').innerText = spec.category.toUpperCase();
      document.getElementById('modal-title').innerText = spec.name;
      
      const detailsContainer = document.getElementById('modal-details');
      detailsContainer.innerHTML = '';
      spec.details.forEach(detail => {
        const p = document.createElement('p');
        p.className = 'flex items-center gap-2 text-gray-200';
        p.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-purple-400"></span> ${detail}`;
        detailsContainer.appendChild(p);
      });

      const modal = document.getElementById('specModal');
      modal.classList.remove('hidden');
      setTimeout(() => modal.classList.remove('opacity-0'), 10);
    }

    function closeModal() {
      const modal = document.getElementById('specModal');
      modal.classList.add('opacity-0');
      setTimeout(() => modal.classList.add('hidden'), 300);
    }

    // Initial load
    renderSpecs('all');
  </script>
